name: Tests
on: [ push, pull_request ]
permissions: read-all
jobs:
    quality:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   symfony-version: '7.4'
                        dependency-script: deps:lowest
                    -   symfony-version: '8.x'
                        dependency-script: deps:highest
        name: Symfony ${{ matrix.symfony-version }}
        steps:
            -   name: Checkout
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            -   name: Set up php 8.5
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.5'
            -   name: Install dependencies
                run: composer self-update && composer ${{ matrix.dependency-script }}
            -   name: Run quality suite
                run: composer qa
    workflow-lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            -   name: Check workflow files
                run: |
                    bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                    ./actionlint -color
                shell: bash
